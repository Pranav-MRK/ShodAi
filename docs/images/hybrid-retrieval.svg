<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="380" rx="20" fill="url(#bg)"/>
  <text x="450" y="46" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Hybrid Retrieval Pipeline</text>
  <text x="450" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Lexical + semantic search fused with Reciprocal Rank Fusion</text>

  <!-- Query -->
  <rect x="30" y="150" width="140" height="80" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="100" y="186" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="600">Research</text>
  <text x="100" y="206" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="600">Query</text>

  <!-- BM25 -->
  <rect x="250" y="105" width="210" height="80" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="355" y="138" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="700">BM25 Keyword Search</text>
  <text x="355" y="160" text-anchor="middle" fill="#cbd5e1" font-size="12">Exact terminology matching</text>
  <text x="355" y="176" text-anchor="middle" fill="#64748b" font-size="11">OpenSearch</text>

  <!-- Semantic -->
  <rect x="250" y="205" width="210" height="80" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="355" y="238" text-anchor="middle" fill="#c4b5fd" font-size="16" font-weight="700">Semantic Search</text>
  <text x="355" y="260" text-anchor="middle" fill="#cbd5e1" font-size="12">Vector embedding similarity</text>
  <text x="355" y="276" text-anchor="middle" fill="#64748b" font-size="11">Sentence Transformers</text>

  <!-- RRF -->
  <rect x="540" y="150" width="150" height="80" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="615" y="182" text-anchor="middle" fill="#6ee7b7" font-size="16" font-weight="700">Reciprocal</text>
  <text x="615" y="202" text-anchor="middle" fill="#6ee7b7" font-size="16" font-weight="700">Rank Fusion</text>
  <text x="615" y="220" text-anchor="middle" fill="#64748b" font-size="11">RRF</text>

  <!-- Output -->
  <rect x="740" y="150" width="130" height="80" rx="14" fill="#0ea5e9" stroke="#7dd3fc" stroke-width="2"/>
  <text x="805" y="182" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Ranked</text>
  <text x="805" y="202" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Evidence</text>
  <text x="805" y="220" text-anchor="middle" fill="#e0f2fe" font-size="11">Top passages</text>

  <!-- Arrows -->
  <path d="M170 180 C205 180 215 145 248 145" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M170 200 C205 200 215 245 248 245" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M460 145 C500 145 510 175 538 178" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M460 245 C500 245 510 205 538 202" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M690 190 L738 190" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <text x="450" y="340" text-anchor="middle" fill="#94a3b8" font-size="13">score(d) = Σ 1 / (k + rank_i(d))   ·   combines rankings, not raw scores</text>
</svg>
