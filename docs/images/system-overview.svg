<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="520" rx="20" fill="url(#bg2)"/>
  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Shod System Overview</text>
  <text x="450" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">From research question to evidence-backed answer</text>

  <!-- Layer 1: Client -->
  <rect x="40" y="90" width="820" height="70" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="62" y="118" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">CLIENT</text>
  <text x="62" y="144" fill="#f8fafc" font-size="16" font-weight="600">React + Vite research workspace</text>
  <text x="838" y="144" text-anchor="end" fill="#94a3b8" font-size="12">Tailwind · shadcn/ui · Telegram (soon)</text>

  <!-- Layer 2: API -->
  <rect x="40" y="185" width="820" height="60" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="62" y="211" fill="#34d399" font-size="12" font-weight="700" letter-spacing="1">API</text>
  <text x="62" y="233" fill="#f8fafc" font-size="16" font-weight="600">FastAPI + Pydantic</text>
  <text x="838" y="233" text-anchor="end" fill="#94a3b8" font-size="12">POST /research · /docs</text>

  <!-- Layer 3: Agent -->
  <rect x="40" y="270" width="820" height="110" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="62" y="296" fill="#a78bfa" font-size="12" font-weight="700" letter-spacing="1">LANGGRAPH AGENT</text>
  <g font-size="13" font-weight="600" text-anchor="middle" fill="#f8fafc">
    <rect x="62" y="312" width="130" height="48" rx="10" fill="#4c1d95"/><text x="127" y="341">Planner</text>
    <rect x="212" y="312" width="130" height="48" rx="10" fill="#4c1d95"/><text x="277" y="341">Researcher</text>
    <rect x="362" y="312" width="130" height="48" rx="10" fill="#4c1d95"/><text x="427" y="341">Analyzer</text>
    <rect x="512" y="312" width="130" height="48" rx="10" fill="#4c1d95"/><text x="577" y="341">Verifier</text>
    <rect x="662" y="312" width="150" height="48" rx="10" fill="#4c1d95"/><text x="737" y="341">Answer Agent</text>
  </g>
  <g stroke="#c4b5fd" stroke-width="2" marker-end="url(#a2)">
    <line x1="192" y1="336" x2="210" y2="336"/><line x1="342" y1="336" x2="360" y2="336"/>
    <line x1="492" y1="336" x2="510" y2="336"/><line x1="642" y1="336" x2="660" y2="336"/>
  </g>

  <!-- Layer 4: Data & Models -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="40" y="405" width="190" height="64" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="135" y="432" fill="#fbbf24">OpenSearch</text><text x="135" y="452" fill="#94a3b8" font-size="11" font-weight="400">Hybrid retrieval index</text>

    <rect x="250" y="405" width="190" height="64" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="345" y="432" fill="#93c5fd">PostgreSQL</text><text x="345" y="452" fill="#94a3b8" font-size="11" font-weight="400">Graph checkpointing</text>

    <rect x="460" y="405" width="190" height="64" rx="14" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
    <text x="555" y="432" fill="#f9a8d4">Ollama · Gemini · Groq</text><text x="555" y="452" fill="#94a3b8" font-size="11" font-weight="400">LLM inference</text>

    <rect x="670" y="405" width="190" height="64" rx="14" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
    <text x="765" y="432" fill="#5eead4">arXiv API</text><text x="765" y="452" fill="#94a3b8" font-size="11" font-weight="400">Paper discovery</text>
  </g>

  <!-- vertical arrows -->
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)">
    <line x1="450" y1="160" x2="450" y2="183"/>
    <line x1="450" y1="245" x2="450" y2="268"/>
    <line x1="450" y1="380" x2="450" y2="403" stroke-dasharray="4 4"/>
  </g>
  <text x="450" y="500" text-anchor="middle" fill="#64748b" font-size="11">LangSmith observability traces every agent run</text>
</svg>
